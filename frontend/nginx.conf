# frontend/nginx.conf


server {
    listen 80;
    server_name _;# Use _ para aceitar qualquer hostname
    # Permite uploads maiores (aumente conforme necessário)

    client_max_body_size 150M;


    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${REACT_APP_BACKEND_URL}/api/;  # Usamos direto o backend LB + /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendidos para uploads demorados
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Evita buffering em disco e melhora performance com arquivos grandes
        proxy_request_buffering off;

        # Buffers aumentados para evitar flush para disco
        client_body_buffer_size 128M;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
       
}
 
    

    
}