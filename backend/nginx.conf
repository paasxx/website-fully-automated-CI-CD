# backend/nginx.conf

# Zonas de rate limit — ficam fora do server{} porque limit_req_zone
# só pode existir no contexto "http", e esse arquivo inteiro é incluído
# dentro do http{} do nginx.conf principal da imagem.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_req_status 429;

# Recovers the real client IP, masked by the ALB (which always terminates/reopens the TCP connection).
# Only trust the header if the direct connection comes from inside the VPC (back ALB or front container).
set_real_ip_from 10.0.0.0/16;
real_ip_header X-Forwarded-For;
# Without this, nginx would just take the LAST IP in the header — which here is the front
# container's IP (also inside the VPC, "trusted", but not the real client). With recursive on,
# it walks right to left skipping trusted IPs until it finds the first one outside the VPC.
real_ip_recursive on;


upstream gunicorn {
    server unix:/tmp/gunicorn.sock;
}

server {
    listen 8000;
    server_name _;

    # Permite uploads maiores (aumente conforme necessário)
    client_max_body_size 150M;

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ajuste dos timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
    }

    # Configuração para servir arquivos estáticos
    location /static/ {
        alias /app/fintrack/staticfiles/;
    }

    # Configuração para servir arquivos de mídia
    location /media/ {
        alias /app/fintrack/media/;
    }

    # Login — exact match, checado antes de qualquer location por prefixo,
    # não importa a ordem no arquivo.
    location = /api/auth/token/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Upload de fatura — mesma lógica, path exato.
    location = /api/import/upload/ {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Resto da API — qualquer coisa sob /api/ que não bateu nos exact match acima.
    location /api/ {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # add_header 'Access-Control-Allow-Origin' '*';
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        # add_header 'Access-Control-Allow-Headers' 'Origin, Authorization, Content-Type, Accept';
        # add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Ajuste dos timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Configurações adicionais conforme necessário
}
