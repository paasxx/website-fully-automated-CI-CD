version: '3'

services:
  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: fintrack_db
      POSTGRES_USER: fintrack_user
      POSTGRES_PASSWORD: mypassword

  web:
    build: .
    volumes:
      - ./fintrack:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: fintrack_db
      DB_USER: fintrack_user
      DB_PASSWORD: mypassword
      DB_HOST: db

volumes:
  postgres_data:
