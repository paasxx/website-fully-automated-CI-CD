name: Quality Assurance

on:
  pull_request:
    branches:
      - main
      # - staging

  workflow_dispatch:
    inputs:
      manual_deploy:
        description: 'Trigger manual deployment'
        default: 'true'

  workflow_call:

jobs:
  quality-assurance:
    name: Quality Assurance
    runs-on: ubuntu-latest
    
    container:
      image: docker:latest
      options: --privileged


    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Display Branch
        run: echo "This is the Branch ${{ github.ref }}"

      # - name: Install Docker
      #   run: |
      #     sudo apt-get remove -y docker.io containerd.io
      #     sudo apt-get update
      #     sudo apt-get install -y docker.io

      - name: Build and start backend and database containers
        run: |
            docker-compose -f docker-compose/docker-compose-tests.yml up -d db web

      - name: Build and start backend and database containers
        run: |
            docker ps -a

      - name: List all contents inside the container
        run: docker exec back ls /

      - name: List all contents inside the container
        run: |
            docker exec back bash -c "cd /app && ls" 

      - name: List all contents inside the container
        run: |
            docker exec back bash -c "cd /var && ls" 

      - name: Wait for database to be ready
        run: |
          tries=0
          until docker exec fintrack-db pg_isready -U fintrack_user -d fintrack_db; do
            tries=$((tries + 1))
            if [ "$tries" -ge 30 ]; then
              echo "Postgres did not become ready in time"
              docker logs fintrack-db
              exit 1
            fi
            echo "Waiting for Postgres... ($tries)"
            sleep 2
          done

      - name: Run tests
        run: |
          docker exec back bash -c "cd /app && python manage.py test --verbosity=2"

      - name: Print container logs
        run: docker logs back


      - name: Testes Passaram
        run: |
          echo "testes passaram"