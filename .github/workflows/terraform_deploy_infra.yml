name: Deploy Infrastructure

on:
    workflow_dispatch:
      inputs:
        environment:
          description: 'Escolha o ambiente (ex: dev, staging, prod)'
          required: true
          default: 'dev'
        password:
          description: 'Senha para rodar o workflow manualmente'
          required: true
          type: string

jobs:
  create_s3_and_dynamodb:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Check password (for manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.event.inputs.password }}" != "${{ secrets.WORKFLOW_PASSWORD }}" ]; then
            echo "Senha incorreta!"
            exit 1
          fi
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: Check if bootstrap already exists
        id: check_bootstrap
        run: |
          if aws s3api head-bucket --bucket meu-bucket-terraform-pedro-silveira 2>/dev/null && \
             aws dynamodb describe-table --table-name terraform-locks --region us-east-1 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Bootstrap already exists — skipping apply"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply (Create S3 Bucket and DynamoDB Table)
        if: steps.check_bootstrap.outputs.exists == 'false'
        run: |
            terraform init
            terraform apply -auto-approve -var-file=${{ github.event.inputs.environment }}.tfvars
        working-directory: ./terraform/bootstrap-backend


  # Etapa 4: Provisionar o restante da infraestrutura
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    needs: create_s3_and_dynamodb
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: Terraform Init (Com Backend)
        run: terraform init -var-file=${{ github.event.inputs.environment }}.tfvars
        working-directory: ./terraform/${{ github.event.inputs.environment }}

      - name: Terraform Plan
        run: terraform plan -var-file=${{ github.event.inputs.environment }}.tfvars -target=module.infrastructure
        working-directory: ./terraform/${{ github.event.inputs.environment }}


      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file=${{ github.event.inputs.environment }}.tfvars -target=module.infrastructure
        working-directory: ./terraform/${{ github.event.inputs.environment }}


  print_terraform_outputs_and_state:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    needs: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: Terraform Init
        run: terraform init -var-file=${{ github.event.inputs.environment }}.tfvars
        working-directory: ./terraform/${{ github.event.inputs.environment }}

      - name: Listar todos os outputs do Terraform
        run: terraform output
        working-directory: ./terraform/${{ github.event.inputs.environment }}

      - name: Imprimir estado completo do Terraform
        run: terraform show
        working-directory: ./terraform/${{ github.event.inputs.environment }}

  # Etapa 5: Build and Push Docker Images
  build_and_push:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    needs: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push backend Docker image
        run: |
          docker buildx build --platform linux/amd64 -f ./backend/Dockerfile.prod \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend-repo:latest \
          --push ./backend

      - name: Build and push frontend Docker image
        run: |
          docker buildx build --platform linux/amd64 \
          -f ./frontend/Dockerfile.prod \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/frontend-repo:latest \
          --push ./frontend

      - name: Force ECS to redeploy with new images
        run: |
          aws ecs update-service \
            --cluster dev-cluster \
            --service backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} > /dev/null
          aws ecs update-service \
            --cluster dev-cluster \
            --service frontend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} > /dev/null